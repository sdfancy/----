feature: 2026-05-24-diagnostics-and-logs
created: 2026-05-24

steps:
  - action: "事件契约：定义 DiagnosticEvent、EventFilter、DiagnosticCode 和 bounded EventLog"
    exit_signal: "单测覆盖 append、过滤、容量上限和 dropped 计数。"
    status: done
  - action: "诊断服务骨架：建立 DiagnosticsService 和 DeviceHealthRegistry，先接内存事件和健康状态"
    exit_signal: "PLC/camera/robot warning/rawFrame 能更新事件和 health。"
    status: done
  - action: "文件 sink：接入可配置 raw/event 持久化，写入失败降级为 warning"
    exit_signal: "临时目录测试能看到 JSONL/文本日志，关闭开关后不写文件。"
    status: done
  - action: "应用集成：替换 Application 分散 event wiring，暴露 events(filter) 和 device health snapshot"
    exit_signal: "现有 application loop 测试仍能看到关键事件，PLC/相机流程不变。"
    status: done
  - action: "模拟器：实现本地 PLC/相机模拟入口，复现最小出队闭环和 dual camera 入队"
    exit_signal: "模拟器集成测试生成可检索事件日志。"
    status: done
  - action: "范围守护：复跑现有测试并 grep 外部协议路径"
    exit_signal: "9999/9090、camera、DUCO、Modbus 行为无协议变更。"
    status: done

