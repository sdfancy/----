feature: 2026-05-24-field-config-and-recipes
created: 2026-05-24

steps:
  - action: "配置路径：扩展 [robot] recipe_path，默认指向 config/motion_recipes.toml"
    exit_signal: "AppConfig 测试覆盖 recipe_path 解析和默认值。"
    status: done
  - action: "recipe table：实现 MotionRecipeTable 加载、校验和查询"
    exit_signal: "测试覆盖合法 arm1/arm2、重复 arm、非法 mapping、非法速度和非法 IO。"
    status: done
  - action: "示例配置：新增 motion recipes 示例文件"
    exit_signal: "示例能被 loader 读取，且注释明确现场替换。"
    status: done
  - action: "Application 注入：DUCO 模式加载 recipe table 并注入 controller"
    exit_signal: "测试证明 configured recipe 能让非默认任务规划，缺失 recipe 仍拒绝。"
    status: done
  - action: "范围守护：复跑 robot/app/config 测试和协议 grep"
    exit_signal: "PLC、相机、Modbus、Qt Widgets 行为无变更。"
    status: done

checks:
  - item: "RobotConfig 包含 recipePath，默认 config/motion_recipes.toml"
    source: 名词契约
    status: passed
  - item: "MotionRecipeTable 能加载 [[recipes]] 并按 armId 查询 MotionRecipe"
    source: 名词契约
    status: passed
  - item: "MotionRecipeTable 校验重复 arm、缺失 arm、pose_indices 非 6 个、负数索引、非法速度和非法 IO"
    source: 名词契约
    status: passed
  - item: "config/motion_recipes.toml 提供 arm1/arm2 示例并提示现场替换"
    source: 挂载点
    status: passed
  - item: "Application 在 DUCO 模式加载 recipe table 并调用 setMotionRecipe"
    source: 编排骨架
    status: passed
  - item: "fake robot 和默认空任务不依赖 recipe 文件"
    source: 流程级约束
    status: passed
