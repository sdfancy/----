feature: 2026-05-23-camera-flow-parity
design: camera-flow-parity-design.md
created: 2026-05-24
status: active

steps:
  - id: step-1-application-wiring-refactor
    title: Application 通讯 wiring 结构微重构
    status: done
    exit_signal: Application::wireEvents 拆成 PLC 入队、PLC 出队、诊断事件几个私有函数，现有 spray_tests 全绿，行为零变化。
  - id: step-2-camera-protocol
    title: 相机协议解析与截帧
    status: pending
    exit_signal: 协议测试覆盖 READY、CSV result、括号 E segment、3D 半包、多帧和非法 segment。
  - id: step-3-camera-endpoint
    title: CameraEndpoint 通讯骨架
    status: pending
    exit_signal: 模拟相机可连接 dual 2D/3D 端口并收发 payload，legacy client 可按配置连接和发送触发。
  - id: step-4-dual-enqueue-workflow
    title: dual camera 11/12 入队状态机
    status: pending
    exit_signal: 集成测试复现 11 -> READY -> 12 -> 3D -> Done，覆盖 fallback、晚到 2D、重复 READY。
  - id: step-5-legacy-single-camera
    title: legacy 单相机 parity
    status: pending
    exit_signal: legacy 单相机测试覆盖触发、回包写队列、sequential 与 counted 匹配，且不启动 9001/9002。
  - id: step-6-application-integration
    title: 应用集成、日志与运行快照
    status: pending
    exit_signal: 端到端日志和 snapshot 可按 count/pointer 追踪 PLC -> camera -> queue，PLC 9999/9090 和 fake robot 出队闭环保持可用。

checks:
  - id: check-no-duco
    title: 本 feature 不引入 DUCO SDK 或真实机械臂控制
    status: pending
    source: design 1 明确不做
  - id: check-no-widgets-modbus
    title: 本 feature 不引入 Qt Widgets HMI 或 Modbus
    status: pending
    source: design 1 明确不做
  - id: check-plc-contract
    title: PLC 9999/9090 字段顺序、端口和出队反馈 XN/XD 不变
    status: pending
    source: design 1 和 design 3 反向核对项
  - id: check-camera-contract
    title: 2D READY/result 与 3D (...)EA(...)E 外部格式不变
    status: pending
    source: design 1 明确不做和 design 2.1 接口示例
  - id: check-queue-manager-boundary
    title: QueueManager 不承载相机状态机，只保存 camera payload
    status: pending
    source: design 1 关键决策和 design 3 反向核对项
  - id: check-nonblocking-callbacks
    title: PLC 和相机 socket 回调不阻塞等待对方返回
    status: pending
    source: design 2.2 流程级约束
  - id: check-ready-idempotency
    title: READY 窗口内重复 READY 不重复发送 2D 请求
    status: pending
    source: design 3 关键场景 3
  - id: check-fallback-and-late-2d
    title: 12 无 2D 类型时发送 00,00 且晚到 2D 被丢弃
    status: pending
    source: design 3 关键场景 5
  - id: check-done-once-after-both-arms
    title: arm1/arm2 都写入 3D payload 后 Done 只发送一次
    status: pending
    source: design 2.2 流程级约束和 design 3 关键场景 6
  - id: check-3d-framing
    title: 3D 半包保留等待补齐，非法 segment 只记录 WARN 不崩溃
    status: pending
    source: design 3 关键场景 7
  - id: check-legacy-mode-ports
    title: legacy 单相机模式不启动 dual 9001/9002 服务
    status: pending
    source: design 3 关键场景 8
