[plc]
host = "0.0.0.0"
enqueue_port = 9999
dequeue_port = 9090

[queue]
prefetch_offset = 0
max_items_per_arm = 128

[fake_robot]
enabled = true
accept_delay_ms = 20
finish_delay_ms = 80

[robot]
mode = "fake"
ip = "127.0.0.1"
port = 7003
heartbeat_ms = 1000
prepare_on_start = false
auto_power_on = true
auto_enable = true

[camera]
host = "0.0.0.0"
camera2d_port = 9001
camera3d_port = 9002
camera3d_enabled = false
legacy_host = "127.0.0.1"
legacy_port = 9001
flow_mode = "legacy_single_camera"
camera_correlation_mode = "sequential"
camera_count_extract_mode = "auto"

[logging]
raw_frames = true
log_dir = "logs"
persist_raw_frames = false
persist_events = false
max_in_memory_events = 1000
flush_interval_ms = 1000

[modbus]
enabled = false
host = "127.0.0.1"
port = 502
default_slave_id = 1
timeout_ms = 1000
retries = 3
address_table = "config/modbus_nodes.toml"
